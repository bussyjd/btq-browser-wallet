# Everything the README tells a reader to run, run on every push and pull
# request: lint, types, the unit + security suites, the extension build, and
# the end-to-end suite that drives the built extension in a real Chromium.
#
# The e2e suite launches a persistent context with `--load-extension`, which
# only works in a headed or new-headless Chromium — new headless (what
# Playwright's `chromium` channel uses) supports extensions, so no Xvfb is
# needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security tests
        run: npm test

      - name: Build the extension
        run: npm run build

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: btq-browser-wallet-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

      # Keyed on the lockfile: a Playwright version bump changes it, and a
      # changed key means a fresh browser download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser, not the apt packages the runner image may
      # be missing, so the deps step still runs on a cache hit.
      - name: Install system dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # SKIP_BUILD=1 makes the suite drive the exact dist/ uploaded above
      # instead of rebuilding it (tests/e2e/global-setup.ts).
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
