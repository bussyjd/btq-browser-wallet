<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTQ Wallet — demo dapp</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1f2f4;
        --surface: #fff;
        --ink: #14171c;
        --ink-2: #4b515a;
        --ink-3: #6c7682;
        --line: rgba(20, 23, 28, 0.13);
        --accent: #35a4ea;
        --accent-ink: #0e73b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070b11;
          --surface: #0f1620;
          --ink: #eef2f6;
          --ink-2: #aeb6c0;
          --ink-3: #888f99;
          --line: rgba(255, 255, 255, 0.12);
          --accent-ink: #5bb6ee;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 40px 20px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 620px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.lede {
        margin: 0 0 20px;
        color: var(--ink-2);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #04121d;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 14px;
        margin: 0 0 16px;
      }
      dt {
        color: var(--ink-3);
      }
      dd {
        margin: 0;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      pre {
        margin: 0;
        padding: 12px;
        min-height: 140px;
        max-height: 260px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        color: var(--ink-2);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BTQ Wallet demo dapp</h1>
      <p class="lede">
        A plain page with no extension access of its own. Everything below goes through
        <code>window.btq</code>, which the wallet injects into the page.
      </p>

      <dl>
        <dt>Provider</dt>
        <dd data-testid="dapp-status">checking…</dd>
        <dt>Origin</dt>
        <dd data-testid="dapp-origin"></dd>
        <dt>Accounts</dt>
        <dd data-testid="dapp-accounts-value">[]</dd>
      </dl>

      <div class="row">
        <button class="primary" data-testid="dapp-connect">Connect</button>
        <button data-testid="dapp-accounts">Accounts</button>
        <button data-testid="dapp-disconnect">Disconnect</button>
        <button data-testid="dapp-probe">Try wallet.unlock (should fail)</button>
      </div>

      <pre data-testid="dapp-log"></pre>
    </main>

    <script>
      (function () {
        'use strict';
        var logEl = document.querySelector('[data-testid="dapp-log"]');
        var statusEl = document.querySelector('[data-testid="dapp-status"]');
        var accountsEl = document.querySelector('[data-testid="dapp-accounts-value"]');
        var originEl = document.querySelector('[data-testid="dapp-origin"]');
        // Exposed so the end-to-end test can assert on what the page saw.
        window.__btqLog = [];

        function log(line) {
          window.__btqLog.push(line);
          logEl.textContent += line + '\n';
          logEl.scrollTop = logEl.scrollHeight;
        }

        function showAccounts(accounts) {
          accountsEl.textContent = JSON.stringify(accounts);
        }

        originEl.textContent = window.location.origin;

        if (!window.btq || window.btq.isBtq !== true) {
          statusEl.textContent = 'not found — install the extension and serve this page over http(s)';
          log('window.btq is missing. Content scripts only run on http:// and https:// pages.');
          return;
        }
        statusEl.textContent = 'window.btq detected';
        log('provider ready: ' + Object.keys(window.btq).sort().join(', '));

        window.btq.on('accountsChanged', function (accounts) {
          showAccounts(accounts);
          log('event accountsChanged ' + JSON.stringify(accounts));
        });

        function report(label, error) {
          var code = error && error.code !== undefined ? error.code : 'none';
          log(label + ' rejected: ' + (error && error.message) + ' (code ' + code + ')');
        }

        document.querySelector('[data-testid="dapp-connect"]').addEventListener('click', function () {
          log('btq_requestAccounts …');
          window.btq
            .request({ method: 'btq_requestAccounts' })
            .then(function (accounts) {
              showAccounts(accounts);
              log('connected: ' + JSON.stringify(accounts));
            })
            .catch(function (e) {
              report('btq_requestAccounts', e);
            });
        });

        document.querySelector('[data-testid="dapp-accounts"]').addEventListener('click', function () {
          window.btq
            .request({ method: 'btq_accounts' })
            .then(function (accounts) {
              showAccounts(accounts);
              log('btq_accounts: ' + JSON.stringify(accounts));
            })
            .catch(function (e) {
              report('btq_accounts', e);
            });
        });

        document.querySelector('[data-testid="dapp-disconnect"]').addEventListener('click', function () {
          window.btq
            .request({ method: 'btq_disconnect' })
            .then(function () {
              showAccounts([]);
              log('disconnected');
            })
            .catch(function (e) {
              report('btq_disconnect', e);
            });
        });

        // The page must not be able to reach the wallet surface, directly or by
        // forging a relay message. Both attempts are logged, both must fail.
        document.querySelector('[data-testid="dapp-probe"]').addEventListener('click', function () {
          window.btq
            .request({ method: 'wallet.unlock', params: { password: 'guess' } })
            .then(function (r) {
              log('UNEXPECTED: wallet.unlock resolved ' + JSON.stringify(r));
            })
            .catch(function (e) {
              report('wallet.unlock', e);
            });
          window.addEventListener('message', function onForged(event) {
            var d = event.data;
            if (!d || d.channel !== 'btq-wallet' || d.kind !== 'response' || d.id !== 424242) return;
            window.removeEventListener('message', onForged);
            log('forged relay request answered: ' + (d.error || JSON.stringify(d.result)));
          });
          window.postMessage(
            {
              channel: 'btq-wallet',
              id: 424242,
              kind: 'request',
              method: 'wallet.unlock',
              params: { password: 'guess' },
            },
            window.location.origin,
          );
        });
      })();
    </script>
  </body>
</html>
